name: OpenScan
options:
  bundleIdPrefix: com.esbeinc
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 2KJ8W6N44B
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  OpenScan:
    type: application
    platform: iOS
    sources:
      - path: OpenScan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.esbeinc.openscan
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: OpenScan/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: OpenScan/Resources/Info.plist
      properties:
        CFBundleDisplayName: OpenScan
        UILaunchScreen: {}
        NSCameraUsageDescription: OpenScan uses the camera and LiDAR sensor to capture 3D scans.
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  OpenScanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: OpenScan
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.esbeinc.openscan.tests
schemes:
  OpenScan:
    build:
      targets:
        OpenScan: all
    test:
      targets: [OpenScanTests]
